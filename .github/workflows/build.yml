name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Static checks
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build portable EXE
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: THE-LAST-SAVE-Windows
          path: dist/*.exe
